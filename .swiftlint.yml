disabled_rules:
  - trailing_whitespace
  - todo
  - opening_brace
  - unused_setter_value
  - switch_case_alignment
  - vertical_parameter_alignment
  - comment_spacing
  - multiple_closures_with_trailing_closure
  - void_function_in_ternary
  - implicitly_unwrapped_optional
  - type_body_length

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - multiline_arguments
  - multiline_parameters
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - private_outlet
  - redundant_nil_coalescing
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - strong_iboutlet
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition
  - colon
  - fatal_error_message
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_nsgeometry_functions
  - return_arrow_whitespace
  - trailing_newline
  - unused_optional_binding
  - vertical_whitespace
  - custom_rules

included:
  - WeatherApp
  - Packages

excluded:
  - Carthage
  - Pods
  - DerivedData
  - .build
  - "App/Tests/*"
  - "Packages/WeatherAppSecrets/*"
  - "Packages/WeatherAppSecretsInterfaces/*"
  - "Packages/*/.build/*"
  - "Packages/*/Tests/*"
  - "**/Generated/*"
  - "**/*+Generated.swift"
  - "**/Package.swift"
  - fastlane

# Customized rules
line_length:
  warning: 120
  error: 150
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

file_length:
  warning: 400
  error: 500

function_body_length:
  warning: 50
  error: 80

function_parameter_count:
  warning: 5
  error: 8

type_name:
  min_length: 3
  max_length: 40

identifier_name:
  min_length: 3
  max_length: 40
  excluded:
    - id
    - url
    - URL
    - to

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level:
    warning: 2

colon:
  apply_to_dictionaries: false

indentation: 4

custom_rules:
  no_objcMembers:
    name: "@objcMembers"
    regex: "@objcMembers"
    message: "Explicitly use @objc on each member you want to expose to Objective-C"
    severity: error

  no_direct_standard_out_logs:
    name: "Writing log messages directly to standard out is disallowed"
    regex: "(\\bprint|\\bdebugPrint|\\bdump|Swift\\.print|Swift\\.debugPrint|Swift\\.dump)\\s*\\("
    match_kinds:
      - identifier
    message: "Don't commit `print(...)`. Use SwiftMoLogger instead."
    severity: warning

  weatherApp_force_unwrapping:
    name: "Force Unwrapping"
    regex: "\\!(?!\\s*//)"
    message: "Avoid force unwrapping. Use safe unwrapping instead."
    severity: warning

  weatherApp_todo_fixme:
    name: "TODO/FIXME Comments"
    regex: '\/\/\s*(TODO|FIXME)'
    message: "Consider creating an issue instead of TODO/FIXME comments."
    severity: warning

  weatherApp_hardcoded_strings:
    name: "Hardcoded Strings"
    regex: '"[^"]{20,}"'
    message: "Consider using localized strings (L10n) for long text."
    severity: warning

  weatherApp_api_keys:
    name: "API Keys"
    regex: '(api[_-]?key|secret|token|password)\s*=\s*"[^"]+"'
    message: "Potential API key or secret detected. Use WeatherAppSecrets instead."
    severity: error

allow_zero_lintable_files: false
strict: false

reporter: "xcode"
